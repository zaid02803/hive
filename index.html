<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hive Monitor</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1d9;
    --temp: #b4530a; --hum: #1f6f9e; --out: #8d8b84; --warn-bg: #fff4d6; --warn-ink: #7a5300; --bad: #a61b1b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --ink: #f1efe8; --muted: #a3a197; --line: #34332f;
      --temp: #f0a050; --hum: #6cb6e0; --out: #9b998f; --warn-bg: #3a3020; --warn-ink: #f3d48a; --bad: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
  .now { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .label { color: var(--muted); font-size: 13px; }
  .big { font-size: 38px; font-weight: 600; letter-spacing: -0.5px; line-height: 1.1; margin-top: 4px; }
  .small { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .temp .big { color: var(--temp); }
  .hum .big { color: var(--hum); }
  .warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 10px 12px;
          font-size: 14px; margin-bottom: 12px; }
  svg { display: block; width: 100%; height: auto; }
  .axis { fill: var(--muted); font-size: 11px; }
  .grid { stroke: var(--line); stroke-width: 1; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 13px; color: var(--muted); }
  .stats b { display: block; color: var(--ink); font-size: 15px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .note { font-size: 14px; margin: 0; }
  .key { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  .key i { display: inline-block; width: 14px; border-top: 1.5px solid var(--out); margin-right: 6px; vertical-align: middle; }
  .key a { color: inherit; }
  .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
</style>
</head>
<body>
<main id="app"></main>
<script>
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
const dec = s => [...s].reduce((v, c) => v * 64 + B64.indexOf(c), 0);

function parse(frag) {
  if (!frag || frag[0] !== "a" || frag.length < 21) return null;
  const head = {
    tmin: dec(frag.slice(1, 7)), idx: dec(frag.slice(7, 9)), mv: dec(frag.slice(9, 11)) * 2,
    pct: dec(frag.slice(11, 13)), iv: dec(frag.slice(13, 15)) || 30, flags: dec(frag.slice(15, 17))
  };
  const ring = frag.slice(17), n = Math.floor(ring.length / 4), pts = [];
  for (let j = 0; j < n; j++) {
    const v = dec(ring.slice(4 * j, 4 * j + 4)), tc = v >> 12, hc = v & 0xfff;
    if (!tc) continue;
    const age = (head.idx - j + n) % n;
    pts.push({ age, t: head.tmin ? (head.tmin - age * head.iv) * 60000 : null,
               temp: tc / 20 - 40, rh: hc / 40 });
  }
  pts.sort((a, b) => b.age - a.age);
  return { head, pts, n };
}

const fmtTime = ms => new Date(ms).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
const fmtDay = ms => new Date(ms).toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
const c2f = c => c * 9 / 5 + 32;
const t1 = v => v.toFixed(1) + " °C", h0 = v => v.toFixed(0) + "%";
function ago(ms) {
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if (h < 48) return h + (h === 1 ? " hour ago" : " hours ago");
  return Math.round(h / 24) + " days ago";
}

// Dew point, Magnus formula. Water condenses on anything cooler than this.
function dew(t, rh) {
  const a = 17.62, b = 243.12, g = Math.log(Math.max(rh, 1) / 100) + a * t / (b + t);
  return b * g / (a - g);
}

function condensation(pts, iv) {
  const latest = pts[pts.length - 1];
  const wet = pts.filter(p => p.age * iv < 1440 && p.rh >= 80).length * iv / 60;
  if (wet < 6 && latest.rh < 85) return "";
  return `Condensation risk. Humidity has been above 80% for ${Math.round(wet)} of the last 24 hours, ` +
         `dew point ${dew(latest.temp, latest.rh).toFixed(0)} °C. Water forms on anything cooler than that, ` +
         `so check the inner cover and the walls for drops.`;
}

// ---- the phone remembers the battery at each tap, per hive, for the outlook ----

const key = hive => "hive" + (hive || "x");
function logBattery(hive, head) {
  if (!head.tmin) return;
  try {
    const bk = key(hive) + ":battery", bl = JSON.parse(localStorage.getItem(bk) || "[]");
    if (!bl.length || bl[bl.length - 1][0] !== head.tmin) bl.push([head.tmin, head.mv, head.pct]);
    localStorage.setItem(bk, JSON.stringify(bl.slice(-500)));
  } catch (e) {}
}

// Battery outlook from the taps this phone has seen: needs two taps at least two days apart.
function outlook(hive, head) {
  try {
    const log = JSON.parse(localStorage.getItem(key(hive) + ":battery") || "[]");
    const last = log[log.length - 1], first = log.find(e => e[0] <= last[0] - 2 * 1440 && e[2] > 0);
    if (!first || head.flags & 48) return "";
    const days = (last[0] - first[0]) / 1440, drop = first[2] - last[2];
    if (drop <= 0) return "";
    const perWeek = drop / days * 7, left = last[2] / (drop / days);
    return `, down ${perWeek.toFixed(1)}% a week, about ${left >= 60 ? Math.round(left / 30) + " months" : Math.round(left) + " days"} left`;
  } catch (e) {
    return "";
  }
}

// ---- the temperature outside, hourly, from Open-Meteo (Brampton) ----
// Drawn as a thin grey line under the hive's. It needs signal once; the last good answer stays on the phone.

const LAT = 43.73, LON = -79.76, OUT_KEY = "outside:" + LAT + "," + LON;
const OUT_URL = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
                "&hourly=temperature_2m&past_days=7&forecast_days=1&timezone=auto&timeformat=unixtime";
const today = () => local(Date.now()).slice(0, 10);
const num = x => typeof x === "number" && isFinite(x) ? x : null;

function outCached() {                                 // { day, at, t0, v }: hourly from t0 (unix seconds)
  try {
    const c = JSON.parse(localStorage.getItem(OUT_KEY) || "null");
    return c && Number.isFinite(c.t0) && Number.isFinite(c.at) && Array.isArray(c.v) && c.v.filter(x => num(x) !== null).length > 1 ? c : null;
  } catch (e) {
    return null;
  }
}
const outPoints = c => c ? c.v.map((x, i) => [(c.t0 + 3600 * i) * 1000, num(x)]) : null;

async function outFetch() {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(OUT_URL, { signal: ctl.signal });
    if (!r.ok) return null;
    const h = (await r.json()).hourly, t = h.time, now = Date.now();
    if (!Array.isArray(t) || !Array.isArray(h.temperature_2m) || t.length !== h.temperature_2m.length || t[1] - t[0] !== 3600) return null;
    const v = h.temperature_2m.slice(0, t.filter(s => s * 1000 <= now + 3600000).length)    // drop the forecast beyond the next hour
                .map(x => num(x) === null ? null : Math.round(x * 10) / 10);
    return v.filter(x => x !== null).length > 1 ? { day: today(), at: now, t0: t[0], v } : null;
  } catch (e) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

// The outside readings inside the tag's 7 days, plus an hour either side so the line meets both edges.
function outIn(out, geo) {
  if (!out || !geo.tmin) return null;
  const end = geo.tmin * 60000, start = end - geo.n * geo.iv * 60000;
  const pts = out.filter(p => p[0] >= start - 3600000 && p[0] <= end + 3600000);
  const vals = pts.filter(p => p[1] !== null && p[0] >= start && p[0] <= end).map(p => p[1]);
  return vals.length > 1 ? { pts, vals } : null;
}

let outBusy = false;
async function outRefresh() {
  if (outBusy || navigator.onLine === false || !state.head || !state.head.tmin) return;
  const c = outCached();
  if (c && c.day === today() && Date.now() - c.at < 3 * 3600000) return;   // today's is fresh enough
  outBusy = true;
  const rec = await outFetch();
  outBusy = false;
  if (!rec) return;
  try { localStorage.setItem(OUT_KEY, JSON.stringify(rec)); } catch (e) {}
  state.out = outPoints(rec);
  paintTemp();
}

function chart(pts, key, color, unit, minSpan, head, o) {
  const W = 560, H = 170, L = 34, R = 8, T = 8, B = 22;
  const vals = pts.map(p => p[key]).concat(o ? o.vals : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < minSpan) { const m = (hi + lo) / 2; lo = m - minSpan / 2; hi = m + minSpan / 2; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const span = head.n * head.iv;                       // minutes covered by the tag
  const x = p => head.tmin
    ? L + (W - L - R) * (1 - p.age * head.iv / span)
    : L + (W - L - R) * (1 - p.age / head.n);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let d = "", prev = null;
  for (const p of pts) {
    const gap = prev && (prev.age - p.age) > 1;
    d += (prev === null || gap ? "M" : "L") + x(p).toFixed(1) + " " + y(p[key]).toFixed(1) + " ";
    prev = p;
  }
  let grid = "";
  if (head.tmin) {                                     // a line at each local midnight
    const end = head.tmin * 60000, start = end - span * 60000;
    const day = new Date(end); day.setHours(0, 0, 0, 0);
    for (let t = day.getTime(); t > start; t -= 86400000) {
      const gx = L + (W - L - R) * (t - start) / (end - start);
      if (gx < L + 12) continue;
      grid += `<line class="grid" x1="${gx}" x2="${gx}" y1="${T}" y2="${H - B}"/>` +
              `<text class="axis" x="${gx + 3}" y="${H - 6}">${new Date(t).toLocaleDateString([], { weekday: "short" })}</text>`;
    }
  }
  const ticks = [hi - pad, lo + pad].map(v =>
    `<text class="axis" x="${L - 4}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(0)}</text>` +
    `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke-dasharray="2 4"/>`).join("");
  let under = "";
  if (o) {                                             // the outside line, same time axis, same degrees
    const end = head.tmin * 60000, start = end - span * 60000;
    let od = "", on = false;
    for (const p of o.pts) {
      if (p[1] === null) { on = false; continue; }
      od += (on ? "L" : "M") + (L + (W - L - R) * (p[0] - start) / (end - start)).toFixed(1) + " " + y(p[1]).toFixed(1) + " ";
      on = true;
    }
    under = `<clipPath id="tclip"><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/></clipPath>` +
            `<path d="${od}" fill="none" stroke="var(--out)" stroke-width="1.5" stroke-linejoin="round" clip-path="url(#tclip)"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${key === "temp" ? "Temperature" : "Humidity"} over the last 7 days${o ? ", with the temperature outside" : ""}">
    ${grid}${ticks}${under}<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}

function stats(pts, key, fmt, iv) {
  const last = pts.filter(p => p.age * iv < 1440);
  if (!last.length) return "";
  const v = last.map(p => p[key]);
  const avg = v.reduce((a, b) => a + b, 0) / v.length;
  return `<div class="stats"><div>Low 24 h<b>${fmt(Math.min(...v))}</b></div>
          <div>Average<b>${fmt(avg)}</b></div><div>High 24 h<b>${fmt(Math.max(...v))}</b></div></div>`;
}

const state = { hive: "", pts: [], db: null, head: null, geo: null, out: null };

function tempCard() {
  const { pts, head, geo, out } = state;
  let o = null, svg;
  try {
    o = outIn(out, geo);
    svg = chart(pts, "temp", "var(--temp)", "°C", 4, geo, o);
  } catch (e) {                                        // the outside line must never cost the page its chart
    o = null;
    svg = chart(pts, "temp", "var(--temp)", "°C", 4, geo);
  }
  return `<div class="row"><h2>Temperature, last 7 days</h2><span class="label">°C</span></div>
      ${svg}${o ? `<p class="key"><i></i>Grey line is outside, from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>` : ""}${stats(pts, "temp", t1, head.iv)}`;
}

function paintTemp() {                                 // redraw just this card when the weather arrives late
  const el = document.getElementById("tcard");
  if (!el || !state.head) return;
  try { el.innerHTML = tempCard(); } catch (e) {}
}

function render() {
  const app = document.getElementById("app");
  const hive = new URLSearchParams(location.search).get("h") || "";
  const data = parse(location.hash.slice(1));
  document.title = hive ? "Hive " + hive : "Hive Monitor";
  if (!data || !data.pts.length) {
    app.innerHTML = `<h1>${hive ? "Hive " + hive : "Hive monitor"}</h1>
      <div class="empty">Hold your phone against the lid of the box to see the readings.</div>`;
    return;
  }
  const { head, pts } = data, latest = pts[pts.length - 1];
  const geo = { n: data.n, iv: head.iv, tmin: head.tmin };
  logBattery(hive, head);
  Object.assign(state, { hive, pts, head, geo, out: outPoints(outCached()) });
  const warns = [];
  if (head.flags & 1) warns.push("The box's clock isn't set, so the times are missing.");
  if (head.flags & 2) warns.push("Battery is low. Charge it soon.");
  if (head.flags & 4) warns.push("The sensor didn't answer on the last reading. Check the long cable.");
  if (head.tmin && Date.now() - head.tmin * 60000 > (2 * head.iv + 30) * 60000)
    warns.push("No new readings since " + fmtTime(head.tmin * 60000) + ". The battery may be flat.");
  const wet = condensation(pts, head.iv);
  if (wet) warns.push(wet);
  const when = head.tmin ? `Updated ${ago(head.tmin * 60000)}, ${fmtTime(head.tmin * 60000)}` : "Latest reading";
  const at = head.tmin ? " at " + new Date(head.tmin * 60000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  const power = head.flags & 16 ? "charging" + at : head.flags & 32 ? "on USB" + at : "on battery";
  const batt = head.mv ? `Battery ${head.pct}%, ${power}${outlook(hive, head)}` : "";
  const nextMs = head.tmin ? (head.tmin + head.iv) * 60000 : 0;
  const mins = Math.round((nextMs - Date.now()) / 60000);
  const next = nextMs && mins >= 0 && mins <= head.iv
    ? `Next reading ${mins < 1 ? "any moment" : "in " + mins + " min"}, ${new Date(nextMs).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}` : "";
  app.innerHTML = `
    <h1>Hive ${hive}</h1>
    <p class="sub">${when}${batt ? " · " + batt : ""}${next ? "<br>" + next : ""}</p>
    ${warns.map(w => `<div class="warn">${w}</div>`).join("")}
    <div class="now">
      <div class="card temp"><div class="label">Temperature</div>
        <div class="big">${latest.temp.toFixed(1)}°C</div><div class="small">${c2f(latest.temp).toFixed(0)} °F</div></div>
      <div class="card hum"><div class="label">Humidity</div>
        <div class="big">${latest.rh.toFixed(0)}%</div><div class="small">dew point ${dew(latest.temp, latest.rh).toFixed(1)} °C</div></div>
    </div>
    <div class="card" id="tcard">${tempCard()}</div>
    <div class="card"><div class="row"><h2>Humidity, last 7 days</h2><span class="label">%</span></div>
      ${chart(pts, "rh", "var(--hum)", "%", 10, geo)}${stats(pts, "rh", h0, head.iv)}</div>
    <div class="card"><h2>Full history</h2>
      <p class="note">To collect the full history, plug the box into a PC and wait up to ${head.iv} minutes. The box wakes once every ${head.iv} minutes to take a reading, and that is when it notices the PC. A drive called HIVE${hive} then appears with history.csv on it and stays until you unplug.</p>
    </div>`;
  outRefresh().catch(() => {});
}


window.addEventListener("hashchange", render);
window.addEventListener("online", () => outRefresh().catch(() => {}));
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
